
[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
rust = { version = "1.97.1", components = [
	"rustfmt",
	"clippy",
	"llvm-tools-preview",
	"rust-analyzer",
] }


# Da aggiunere cose quando necessarie. Come per esempio fare il build automatico quando un file cambia (watch).
# Per ora mette a posto l'installazione di git.
[tasks.setup]
description = "Setup the project"
run = "git config --local include.path ../.gitconfig"

# invocato dalla CI, non pensato per l'uso manuale
[tasks."rust:clippy-ci"]
description = "Lint del workspace, warning come errori"
hide = true
run = "cargo clippy --profile ci --workspace --all-targets -- -D warnings"

# invocato da rust-analyzer, output JSON non leggibile a mano
[tasks."rust:clippy-editor"]
description = "Clippy in formato JSON, per rust-analyzer.check.overrideCommand"
hide = true
run = "cargo clippy --all-targets --message-format=json-diagnostic-rendered-ansi"

# invocato dalla CI, non pensato per l'uso manuale
[tasks."rust:fmt-ci"]
description = "Verifica la formattazione senza modificare i file"
hide = true
run = "cargo fmt --all -- --check"

[tasks."rust:test"]
description = "Esegue la test suite del workspace con nextest"
# --no-tests=warn: nessun crate ha ancora test, altrimenti nextest fallirebbe a vuoto
run = "cargo nextest run --workspace --no-tests=warn"
