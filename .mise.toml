
[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
rust = { version = "1.97.1", components = [
	"rustfmt",
	"clippy",
	"llvm-tools-preview",
	"rust-analyzer",
] }


# Add tasks here as needed, e.g. an automatic build on file change (watch).
# For now it just sets up the git config.
[tasks.setup]
description = "Setup the project"
run = "git config --local include.path ../.gitconfig"

# invoked by rust-analyzer, JSON output not meant to be read by hand
[tasks."rust:clippy-editor"]
description = "Clippy in JSON format, for rust-analyzer.check.overrideCommand"
hide = true
run = "cargo clippy --all-targets --message-format=json-diagnostic-rendered-ansi -- -D warnings"

# invoked by CI, not meant for manual use. fmt, clippy and test in a single
# mise invocation (one step in the workflow) so the toolchain is resolved
# once instead of being repeated at every step; all three use the same
# cargo "ci" profile to share the target dir and avoid recompiling the
# crates twice (clippy with one profile, tests with another)
[tasks."rust:ci"]
description = "Fmt, clippy and test for the workspace, warnings as errors"
hide = true
run = [
	"cargo fmt --all -- --check",
	"cargo clippy --profile ci --workspace --all-targets -- -D warnings",
	"cargo nextest run --workspace --no-tests=warn --cargo-profile ci",
]

[tasks."rust:fmt"]
description = "Format the workspace code"
run = "cargo fmt --all"

[tasks."rust:test"]
description = "Run the workspace test suite with nextest"
# --no-tests=warn: no crate has tests yet, otherwise nextest would fail on an empty run
run = "cargo nextest run --workspace --no-tests=warn"

[tasks."rust:bench"]
description = "Run the benchmarks with Divan"
usage = 'arg "[samples]" help="Number of Divan samples" default="100"'
run = "cargo bench --bench graph_bench -- --sample-count {{ usage.samples }}"
