
[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143"
rust = { version = "1.97.1", components = [
	"rustfmt",
	"clippy",
	"llvm-tools-preview",
	"rust-analyzer",
] }


# Da aggiunere cose quando necessarie. Come per esempio fare il build automatico quando un file cambia (watch).
# Per ora mette a posto l'installazione di git.
[tasks.setup]
description = "Setup the project"
run = "git config --local include.path ../.gitconfig"

# invocato da rust-analyzer, output JSON non leggibile a mano
[tasks."rust:clippy-editor"]
description = "Clippy in formato JSON, per rust-analyzer.check.overrideCommand"
hide = true
run = "cargo clippy --all-targets --message-format=json-diagnostic-rendered-ansi -- -D warnings"

# invocato dalla CI, non pensato per l'uso manuale. fmt, clippy e test in una
# sola invocazione di mise (un solo step nel workflow) così il toolchain viene
# risolto una volta sola invece che ripetersi ad ogni step; tutti e tre usano
# lo stesso profilo cargo "ci" per condividere la target dir ed evitare di
# ricompilare i crate due volte (clippy con un profilo, i test con un altro)
[tasks."rust:ci"]
description = "Fmt, clippy e test del workspace, warning come errori"
hide = true
run = [
	"cargo fmt --all -- --check",
	"cargo clippy --profile ci --workspace --all-targets -- -D warnings",
	"cargo nextest run --workspace --no-tests=warn --cargo-profile ci",
]

[tasks."rust:fmt"]
description = "Formatta il codice del workspace"
run = "cargo fmt --all"

[tasks."rust:test"]
description = "Esegue la test suite del workspace con nextest"
# --no-tests=warn: nessun crate ha ancora test, altrimenti nextest fallirebbe a vuoto
run = "cargo nextest run --workspace --no-tests=warn"

[tasks."rust:bench"]
description = "Esegue i benchmark con Divan"
usage = 'arg "[samples]" help="Numero di sample Divan" default="100"'
run = "cargo bench --bench graph_bench -- --sample-count {{ usage.samples }}"
