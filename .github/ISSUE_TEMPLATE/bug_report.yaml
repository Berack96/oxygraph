name: "Bug Report"
description: "Report an unexpected error, crash, or bug"
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "The exact sequence of actions or commands needed to replicate the issue."
      placeholder: |
        1. Run command '...'
        2. Send payload '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen instead?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Logs / Stack Trace"
      description: "Paste any relevant terminal output, logs, or error traces here."
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "OS, runtime/tool versions, branch, etc."
      placeholder: "Windows 11, PowerShell 5.1, main branch"
    validations:
      required: false
